name: Deploy 黑貓飲食指南 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python -c "import pathlib,re; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script>(.*?)</script>', s, re.S); assert m, 'inline app script not found'; pathlib.Path('/tmp/food-guide-inline.js').write_text(m.group(1))"
          node --check /tmp/food-guide-inline.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
